name: Build MICS Data Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release for auto updates after successful build'
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Verify Rust code
        run: cargo check
      - name: Build Windows GUI executable
        run: cargo build --release
      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 target/release/mics-data.exe).Hash.ToLower()
          "$hash  mics-data.exe" | Set-Content -Encoding ascii target/release/mics-data.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mics-data-windows-x64
          path: |
            target/release/mics-data.exe
            target/release/mics-data.exe.sha256
          if-no-files-found: error
      - name: Publish update to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" target/release/mics-data.exe target/release/mics-data.exe.sha256 --title "${{ github.ref_name }}" --notes "MICS Data Windows auto-update release" --verify-tag

      - name: Publish version from manual workflow
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "v0.2.1" target/release/mics-data.exe target/release/mics-data.exe.sha256 --target "${{ github.sha }}" --title "v0.2.1" --notes "Fix Vietnamese and Japanese UI font fallback"
