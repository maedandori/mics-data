[package]
name = "mics-data"
version = "0.3.1"
edition = "2021"
description = "MICS Firebird read-only Windows GUI with auto updater"

[dependencies]
rsfbclient = { version = "=0.29.0", default-features = false, features = ["pure_rust"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
semver = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1"
